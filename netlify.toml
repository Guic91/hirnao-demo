# HIRNAO — déploiement Netlify (export statique, SANS plugin Next.js)
#
# Ce site est une PWA statique (output: export). Ne pas utiliser @netlify/plugin-nextjs.
# Dans Netlify UI → Plugins : supprimer "@netlify/plugin-nextjs" si installé.
# Dans Netlify UI → Build settings : laisser netlify.toml gérer command + publish.

[build]
  command = "npm run build:netlify"
  publish = "out"

[build.environment]
  NODE_VERSION = "24"
  STATIC_EXPORT = "true"
  NEXT_PUBLIC_DEMO_MODE = "true"
  # Empêche Netlify d'auto-installer @netlify/plugin-nextjs
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

# Production OVH via Coolify — pull image depuis Harbor
# Coolify: New Resource → Docker Compose → repo + ce fichier

services:
  api:
    image: ${HARBOR_REGISTRY}/${HARBOR_PROJECT}/api:latest
    container_name: hirnao-api
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      HOST: 0.0.0.0
      PORT: 3001
      NODE_ENV: production
      DB_BACKEND: firebase
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      - "coolify.managed=true"

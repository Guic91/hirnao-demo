# Sandbox OVH — API + reverse proxy HTTPS
# Usage: cp .env.sandbox.example .env.sandbox && docker compose -f docker/docker-compose.sandbox.yml up -d

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: hirnao-sandbox-api
    restart: unless-stopped
    env_file:
      - ../.env.sandbox
    environment:
      HOST: 0.0.0.0
      PORT: 3001
    expose:
      - "3001"
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    container_name: hirnao-sandbox-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SANDBOX_DOMAIN: ${SANDBOX_DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@hirnao.app}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

  # Optionnel — décommenter pour PostgreSQL + pgvector (DEMO_MODE=false)
